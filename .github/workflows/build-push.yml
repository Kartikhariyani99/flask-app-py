name: docker build & push

on: 
    push:
        branches: [main]
    workflow_dispatch: 
jobs:

        build-and-push: 
            
            runs-on: ubuntu-latest
            steps:
                - name: checkout code
                  uses: actions/checkout@v4

                - name: resolve docker username
                  id: docker-meta
                  run: |
                    DOCKER_USERNAME="${{ vars.DOCKER_USERNAME || github.repository_owner }}"
                    DOCKER_USERNAME="$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')"
                    echo "username=$DOCKER_USERNAME" >> "$GITHUB_OUTPUT"

                - name: docker login
                  uses: docker/login-action@v3
                  with:
                    username: ${{ steps.docker-meta.outputs.username }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

                - name: docker build and push
                  uses: docker/build-push-action@v6
                  with: 
                    context: .
                    push: true
                    tags: ${{ steps.docker-meta.outputs.username }}/flask-app:latest



