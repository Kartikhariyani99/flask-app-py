name: docker build & push

on: 
    push:
        branches: [main]
    workflow_dispatch: 
jobs:

        build-and-push: 
            
            runs-on: ubuntu-latest
            steps:
                - name: checkout code
                  uses: actions/checkout@v4

                - name: docker login
                  uses: docker/login-action@v3
                  with:
                    username: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME || github.actor }}
                    password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

                - name: docker build and push
                  uses: docker/build-push-action@v6
                  with: 
                    context: .
                    push: true
                    tags: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME || github.actor }}/flask-app:latest
                



