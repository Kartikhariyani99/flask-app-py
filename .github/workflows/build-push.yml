name: docker build & push

on: 
    push:
        branches: [main]
    workflow_dispatch: 
jobs:

        build-and-push: 
            
            runs-on: ubuntu-latest
            steps:
                - name: checkout code
                  uses: actions/checkout@v4

                - name: resolve docker username
                  id: docker_username
                  run: |
                    USERNAME="${{ vars.DOCKER_USERNAME }}"
                    USERNAME="$(echo "$USERNAME" | tr -d '[:space:]')"
                    if [ -z "$USERNAME" ]; then
                      USERNAME="${{ github.repository_owner }}"
                    fi
                    echo "value=$USERNAME" >> "$GITHUB_OUTPUT"

                - name: docker login
                  uses: docker/login-action@v3
                  with:
                    username: ${{ steps.docker_username.outputs.value }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

                - name: docker build and push
                  uses: docker/build-push-action@v6
                  with: 
                    context: .
                    push: true
                    tags: ${{ steps.docker_username.outputs.value }}/flask-app
                



