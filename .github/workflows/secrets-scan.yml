name: secrets scan

on: 
    workflow_call:
    workflow_dispatch:

jobs:
    secrets-scan:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
              with:
                fetch-depth: 0

            - name: git leaks
              uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{   secrets.GITHUB_TOKEN }}